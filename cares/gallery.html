<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | CARES Lab | IIT Bombay</title>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202c; --muted:#5a6675; --line:#e3e8ee; --bg:#f6f8fb; --card:#ffffff;
  --blue:#1b5fb4; --blue-d:#123f7a; --teal:#0ea58a; --orange:#e9763a; --red:#d8312b;
  --radius:14px; --shadow:0 1px 2px rgba(16,32,52,.06),0 6px 24px rgba(16,32,52,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Source Serif 4",Cambria,Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(27,95,180,.25);transition:color .15s,border-color .15s}
a:hover{color:var(--blue-d);border-bottom-color:var(--blue-d)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- hero ---------- */
.hero{background:
   radial-gradient(900px 380px at 85% -10%,rgba(14,165,138,.12),transparent 60%),
   radial-gradient(700px 360px at -5% 110%,rgba(27,95,180,.12),transparent 60%),
   #fff;border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:44px;padding-bottom:34px}
.eyebrow{font:600 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:6px 0 10px}
h1{margin:0;font:700 clamp(36px,5vw,54px)/1.1 "Source Serif 4",Cambria,serif;letter-spacing:-.01em;color:var(--blue-d)}
.gcount{margin:10px 0 0;font:600 14px/1 Inter,sans-serif;color:var(--muted);letter-spacing:.02em}

/* ---------- gallery: pinboard ---------- */
.board-wrap{padding:0;margin:0}
.board{
  max-width:1180px;margin:34px auto 40px;padding:52px 40px 56px;border-radius:var(--radius);position:relative;overflow:hidden;
  background-color:#fff;
  background-image:radial-gradient(rgba(27,95,180,.10) 1.2px,transparent 1.6px),
    radial-gradient(900px 380px at 90% -10%,rgba(14,165,138,.08),transparent 60%),
    radial-gradient(700px 360px at -5% 110%,rgba(27,95,180,.08),transparent 60%);
  background-size:18px 18px,100% 100%,100% 100%;
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(3,1fr);gap:40px 34px;align-items:start;
}
.board::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--teal))}
.pol{margin:0;position:relative;background:#fff;padding:12px 12px 14px;border-radius:3px;transform:rotate(var(--r,0deg));box-shadow:0 1px 2px rgba(16,32,52,.10),0 14px 28px -14px rgba(18,63,122,.40);border:1px solid var(--line);transition:transform .25s ease,box-shadow .25s ease;cursor:zoom-in;outline:none}
@media (hover:hover){.pol:hover{transform:rotate(0deg) translateY(-6px) scale(1.035);box-shadow:0 4px 6px rgba(16,32,52,.08),0 26px 40px -16px rgba(18,63,122,.45);z-index:2}}
.pol:focus-visible{transform:rotate(0deg) translateY(-6px) scale(1.035);box-shadow:0 0 0 3px var(--blue),0 26px 40px -16px rgba(40,22,8,.6);z-index:2}
.pol img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#eee}
.pol figcaption{padding:10px 4px 0;text-align:center}
.pol figcaption b{display:block;font:700 22px/1.1 "Caveat","Segoe Print","Bradley Hand",cursive;color:var(--blue-d)}
.pol figcaption span{display:block;margin-top:4px;font:500 12px/1.3 Inter,sans-serif;color:#6b7684}
.pin{position:absolute;top:-9px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--pin) 30%,rgba(0,0,0,.35) 100%);box-shadow:0 3px 4px rgba(0,0,0,.35);z-index:3}
@media (max-width:1000px){.board{grid-template-columns:repeat(2,1fr);margin:24px 16px 32px;padding:40px 26px 44px}}
@media (max-width:600px){
  .board{gap:22px 12px;padding:26px 12px 26px;margin:16px 12px 24px}
  .pol{padding:6px 6px 8px;--r:0deg!important}
  .pol figcaption{padding:6px 2px 0}
  .pol figcaption b{font-size:16px}
  .pol figcaption span{display:none}
  .pin{width:14px;height:14px;margin-left:-7px;top:-7px}
}
@media (prefers-reduced-motion:reduce){.pol{transition:none}}

/* viewer: fixed overlay over the whole frame; the panel is placed next to the clicked photo and kept inside the frame */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,22,40,.88)}
.lb[hidden]{display:none}
.lbp{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 16px);overflow:auto;background:#fff;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.lb figure{margin:0;padding:14px 14px 4px}
.lb img{display:block;max-width:100%;max-height:min(420px,calc(100vh - 240px));margin:0 auto}
.lb figcaption{margin-top:12px;font:500 14.5px/1.5 Inter,sans-serif;color:#2c3845;text-align:center;max-width:560px;margin-left:auto;margin-right:auto}
.lb figcaption b{display:block;font:700 26px/1.1 "Caveat","Segoe Print",cursive;color:#1d2a3a;margin-bottom:4px}
.lbnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 14px 12px;font:600 13px/1 Inter,sans-serif;color:var(--muted)}
.lbn,.lbx{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--blue-d);font:500 26px/1 Inter,sans-serif;cursor:pointer}
.lbn:hover,.lbx:hover{background:#eaf1fb}
.lbx{position:absolute;top:8px;right:8px;width:38px;height:38px;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ---------- footer ---------- */
footer{margin-top:40px;background:var(--blue-d);color:#cfdcf0}
footer .wrap{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-top:26px;padding-bottom:26px;flex-wrap:wrap}
.hfoot .fname{font:700 18px/1.2 Inter,sans-serif;color:#fff;margin-bottom:8px}
.faddr p{margin:0;font-size:15px;line-height:1.6;color:#cfdcf0}
.hfoot a{color:#fff;border-bottom-color:rgba(255,255,255,.3)}
.hfoot a:hover{color:#fff;border-bottom-color:#fff}
.factions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:14px}
.copy{font:600 13px/1 Inter,sans-serif;border:1px solid;border-radius:999px;padding:9px 13px;cursor:pointer;transition:background .15s}
.copy.dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
.copy.dark:hover{background:rgba(255,255,255,.18)}
.flink{font:600 13.5px/1 Inter,sans-serif}
.flogos{display:flex;align-items:center;gap:18px}
.flogos a{border:0;background:#fff;border-radius:14px;padding:10px 14px;display:block}
.flogos img{height:58px;width:auto;display:block}
.flogos .cares img{height:40px;margin:9px 0}
.fbottom{border-top:1px solid rgba(255,255,255,.14);padding-top:14px!important;padding-bottom:18px!important;font:500 12.5px/1.4 Inter,sans-serif;color:#9fb4d4}
@media (max-width:520px){.wrap{padding:0 16px}.flogos img{height:46px}}
@media (pointer:coarse){.copy,.flink{min-height:44px;display:inline-flex;align-items:center}.lbx{width:44px;height:44px}}
</style>
</head>

(function(){
  var board=document.getElementById('board');
  var TILT=[-2.2,1.6,-1.1,2.4,-1.8,1.1,-2.6,1.9,-0.9,2.2,-1.5,1.3];
  var PINS=['#d8312b','#1b5fb4','#0ea58a','#e9763a'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* header: earliest photo month – present */
  var first=null;
  PHOTOS.forEach(function(p){var m=p.meta.match(/([A-Z][a-z]{2}) (20\d\d)/);if(!m)return;var k=+m[2]*12+MON.indexOf(m[1]);if(first===null||k<first)first=k;});
  document.getElementById('gcount').textContent=PHOTOS.length+' photos'+(first===null?'':' · '+MON[first%12]+' '+Math.floor(first/12)+' – present');

  var h='';
  PHOTOS.forEach(function(p,i){
    h+='<figure class="pol" style="--r:'+TILT[i%TILT.length]+'deg;--pin:'+PINS[i%PINS.length]+'" tabindex="0" role="button" aria-label="Open photo: '+esc(p.title)+'" data-i="'+i+'">'+
       '<span class="pin" aria-hidden="true"></span>'+
       '<img src="'+p.img+'" alt="'+esc(p.full)+'" loading="lazy">'+
       '<figcaption><b>'+esc(p.title)+'</b><span>'+esc(p.meta)+'</span></figcaption></figure>';
  });
  board.innerHTML=h;

  /* enlarge */
  var lb=document.createElement('div'); lb.className='lb'; lb.hidden=true; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
  lb.innerHTML='<div class="lbp"><button class="lbx" type="button" aria-label="Close">×</button><figure><img alt=""><figcaption></figcaption></figure>'+
    '<div class="lbnav"><button class="lbn prev" type="button" aria-label="Previous photo">‹</button><span class="lbc"></span><button class="lbn next" type="button" aria-label="Next photo">›</button></div></div>';
  document.body.appendChild(lb);
  var panel=lb.querySelector('.lbp'),img=lb.querySelector('img'),cur=0,anchorY=null;
  /* the embed is usually as tall as the page, so centre the panel on the clicked photo (which is on screen) and clamp it inside the frame */
  function place(){
    var vh=window.innerHeight,ph=Math.min(panel.offsetHeight,vh-16);
    panel.style.maxHeight=(vh-16)+'px';
    var c=anchorY===null?vh/2:anchorY;
    panel.style.top=Math.max(8,Math.min(c-ph/2,vh-ph-8))+'px';
  }
  function show(i){cur=(i+PHOTOS.length)%PHOTOS.length;var p=PHOTOS[cur];img.src=p.img;img.alt=p.full;
    lb.querySelector('figcaption').innerHTML='<b>'+esc(p.title)+'</b>'+esc(p.full);
    lb.querySelector('.lbc').textContent=(cur+1)+' / '+PHOTOS.length;
    if(!lb.hidden)place();}
  img.addEventListener('load',function(){if(!lb.hidden)place()});
  function open(i,el){var r=el.getBoundingClientRect();anchorY=r.top+r.height/2;show(i);lb.hidden=false;place();lb.querySelector('.lbx').focus();}
  function close(){lb.hidden=true}
  document.querySelector('main').addEventListener('click',function(e){var f=e.target.closest('[data-i]');if(f)open(+f.getAttribute('data-i'),f)});
  document.querySelector('main').addEventListener('keydown',function(e){var f=e.target.closest('[data-i]');if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(+f.getAttribute('data-i'),f)}});
  lb.addEventListener('click',function(e){if(e.target===lb||e.target.closest('.lbx'))close();else if(e.target.closest('.prev'))show(cur-1);else if(e.target.closest('.next'))show(cur+1)});
  document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
  window.addEventListener('resize',function(){if(!lb.hidden)place()});
  var sx=null;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)show(cur+(dx<0?1:-1));sx=null});
})();
/* show email: the address is assembled here so it is not in the page source */
document.querySelectorAll('[data-u][data-d]').forEach(function(b){
  b.addEventListener('click',function(){
    var v=b.getAttribute('data-u')+'@'+b.getAttribute('data-d'),a=document.createElement('a');
    a.href='mailto:'+v;a.textContent=v;a.className=b.className;b.replaceWith(a);a.focus();
  });
});
</script>
